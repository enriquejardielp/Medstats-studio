services:
  # Backend: Web Service con Docker (Python + R)
  - type: web
    name: medstats-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.onrender\\.com"

  # Frontend: Static Site (React + Vite)
  - type: web
    name: medstats-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medstats-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
